name: Fast check (Samsung + BuyHatke)

on:
  schedule:
    # fallback only: GitHub drops most short-interval cron runs; cron-job.org dispatches this every 5 min
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      args:
        description: 'Extra flags, e.g. "--dry" to print what would be pinged without pinging or saving'
        required: false
        default: ''

permissions:
  contents: write   # commits state/fast.json so a Samsung deal is only pinged once

concurrency:
  group: oled-samsung   # own group: it only writes state/fast.json, so it never waits behind a full scan
  cancel-in-progress: false

jobs:
  samsung:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # the branch head when the job STARTS: a queued dispatch otherwise checks out the commit it was triggered on,
          # i.e. stale state/ (old alerted.json -> repeat alerts), and its state push then conflicts
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Check Samsung stores + BuyHatke live prices (Amazon/Flipkart)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # deal emails go out the moment a deal is found (same time as the Telegram ping)
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SCAN_ARGS: ${{ inputs.args }}
        run: node scan.js --samsung-only $SCAN_ARGS
      - name: Save pinged deals
        if: always() && !contains(inputs.args, '--dry')
        run: |
          git config user.name "oled-deal-watch"
          git config user.email "actions@users.noreply.github.com"
          git add state/fast.json 2>/dev/null || exit 0
          git diff --staged --quiet && exit 0
          git commit -m "state: Samsung pings [skip ci]"
          for i in 1 2 3 4 5; do if git pull --rebase -X theirs -q && git push -q; then exit 0; fi; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 8 + 3)); done
          exit 1
