name: OLED deal scan

# Parallel scan, built for speed (a glitch price sells out in hours):
#   gate     - is a full scan due? (cron-job.org fires every 15 min with --if-due) If not, it just checks the deal channels.
#   scrape   - 3 parts side by side (amazon / web / shops, see "part" in config.json). Each one pings Telegram the
#              moment one of its sources shows a glitch (early check), then hands its raw listings on as an artifact.
#   combine  - all parts together: AI check, cross-shop comparison, verdicts, remaining alerts, email, state commit.
on:
  schedule:
    # fallback only: cron-job.org dispatches this every 15 min with --if-due; GitHub's own cron drops most runs
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      args:
        description: 'Extra scan.js flags, e.g. "--dry --verify-sample" for a test run that sends nothing and saves nothing; "--email" forces the digest email'
        required: false
        default: ''

permissions:
  contents: read    # least privilege; only gate and combine (the jobs that commit state/) get write below

concurrency:
  # test runs from other branches (always --dry, never save state) get their own lock instead of queueing behind live scans
  group: oled-scan${{ github.ref_name != 'main' && '-test' || '' }}
  cancel-in-progress: false

env:
  SCAN_ARGS: ${{ github.event_name == 'schedule' && '--if-due' || inputs.args }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # commits state/community.json when it only checks the deal channels
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v5
        with:
          # the branch head when the job STARTS: a queued dispatch otherwise checks out the commit it was triggered on,
          # i.e. stale state/ (old alerted.json -> repeat alerts), and its state push then conflicts
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - id: due
        run: |
          if [[ " $SCAN_ARGS " == *" --if-due "* ]]; then node scan.js --due-check; else echo "due=true" >> "$GITHUB_OUTPUT"; fi
      - name: Not due - deal channels only
        if: steps.due.outputs.due != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scan.js --community-only $SCAN_ARGS
      - name: Save seen posts
        if: steps.due.outputs.due != 'true' && !contains(env.SCAN_ARGS, '--dry')
        run: |
          git config user.name "oled-deal-watch"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --staged --quiet && exit 0
          git commit -m "state: seen community posts [skip ci]"
          for i in 1 2 3 4 5; do if git pull --rebase -X theirs -q && git push -q; then exit 0; fi; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 8 + 3)); done
          exit 1

  scrape:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    # pinned: 24.04 ships Google Chrome, so no browser download or apt install per run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false   # one part failing must not cancel the others (combine reports which part is missing)
      matrix:
        part: [amazon, web, shops]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          # these jobs drive a browser through untrusted shop pages and never push: no token left in .git/config
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - uses: ./.github/actions/amazon-scraper
        if: matrix.part == 'shops'
      - name: Scrape ${{ matrix.part }} (early Telegram pings)
        env:
          AMAZON_SCRAPER_URL: http://localhost:8000
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADFUL: '1'   # visible Chrome on a virtual screen (xvfb-run): Smartprix's Cloudflare check rejects headless Chrome
          # deal emails go out the moment a deal is found (same time as the Telegram ping)
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          BROWSER_CHANNEL: chrome
        run: xvfb-run -a node scan.js --part=${{ matrix.part }} $SCAN_ARGS
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: part-${{ matrix.part }}
          # the part's results + the source caches it rewrote (Smartprix pages, BuyHatke watchlist)
          path: |
            parts/
            state/smartprix.json
            state/buyhatke.json
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: debug-${{ matrix.part }}
          path: debug
          if-no-files-found: ignore
          retention-days: 3

  combine:
    needs: [gate, scrape]
    if: always() && needs.gate.outputs.due == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # commits state/ (price history, alerted deals)
    timeout-minutes: 25   # AI setup ~1 min + capped 6 min of inference, verification, email
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - uses: actions/download-artifact@v5
        with:
          pattern: part-*
          path: dl
          merge-multiple: true
      - name: Collect the parts
        run: |
          mkdir -p parts
          cp dl/parts/*.json parts/ 2>/dev/null || true
          for f in smartprix.json buyhatke.json; do [ -f "dl/state/$f" ] && cp "dl/state/$f" state/; done
          ls -la parts
      - name: Compare, AI, alerts and email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADFUL: '1'
          BROWSER_CHANNEL: chrome
          FORCE_EMAIL: ${{ contains(inputs.args, '--email') && !contains(inputs.args, '--dry') && '1' || '' }}
        run: xvfb-run -a node scan.js --combine $SCAN_ARGS
      - name: Keep debug screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-combine
          path: debug
          if-no-files-found: ignore
          retention-days: 3
      - name: Save price history
        if: always() && !contains(env.SCAN_ARGS, '--dry')
        run: |
          git config user.name "oled-deal-watch"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --staged --quiet && exit 0
          git commit -m "state: update price history [skip ci]"
          for i in 1 2 3 4 5; do if git pull --rebase -X theirs -q && git push -q; then exit 0; fi; git rebase --abort 2>/dev/null || true; sleep $((RANDOM % 8 + 3)); done
          exit 1
