name: OLED deal scan

on:
  schedule:
    # fallback only: cron-job.org dispatches this every 15 min with --if-due (full scan hourly, every 15 min in a
    # sale season, channel check otherwise); GitHub's own cron drops most runs on a free account
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      args:
        description: 'Extra scan.js flags, e.g. "--dry --verify-sample" for a test run that sends nothing and saves nothing'
        required: false
        default: ''

permissions:
  contents: write   # lets the job commit state/ (price history) back to the repo

concurrency:
  group: oled-scan
  cancel-in-progress: false

jobs:
  scan:
    # pinned: ubuntu-latest moves to 26.04 in Oct 2026; 24.04 ships Google Chrome, so no browser download or apt install per run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Scan and email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BROWSER_CHANNEL: chrome   # the runner's real Google Chrome: retailers refuse bare headless Chromium on product pages
          FORCE_EMAIL: ${{ github.event_name == 'workflow_dispatch' && !contains(inputs.args, '--dry') && '1' || '' }}
          SCAN_ARGS: ${{ github.event_name == 'schedule' && '--if-due' || inputs.args }}
        run: node scan.js $SCAN_ARGS
      - name: Keep debug screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug
          path: debug
          if-no-files-found: ignore
          retention-days: 3
      - name: Save price history
        if: always() && !contains(inputs.args, '--dry')
        run: |
          git config user.name "oled-deal-watch"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --staged --quiet && exit 0
          git commit -m "state: update price history [skip ci]"
          # rebase in case anything else pushed meanwhile
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
