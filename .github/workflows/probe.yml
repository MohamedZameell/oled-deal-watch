name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1 }
      - name: buyhatke history page in headful chrome
        run: |
          cat > p.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch({ headless: false, channel: 'chrome' });
          const ctx = await b.newContext({ locale: 'en-IN', viewport: { width: 1366, height: 800 } });
          const seen = [];
          for (const u of ['https://www.amazon.in/dp/B0GYG3VLMR', 'https://www.flipkart.com/lenovo-legion-67-31-cm-27-inch-quad-hd-oled-panel-gaming-monitor-legion-27q-10/p/itmc2c0c1b865de4']) {
            const p = await ctx.newPage();
            p.on('response', (r) => { if (/buyhatke|bitbns/.test(r.url()) && r.request().resourceType() !== 'image') seen.push(r.status() + ' ' + r.url().slice(0, 140)); });
            const r = await p.goto('https://buyhatke.com/' + u, { waitUntil: 'domcontentloaded', timeout: 40000 }).catch((e) => console.log('goto err', e.message.slice(0, 100)));
            for (let i = 0; i < 25; i++) { const h = await p.content().catch(() => ''); if (h.includes('maxall:') || i % 6 === 0) console.log(i, r && r.status(), p.url().slice(0, 90), '|', (await p.title().catch(() => '')).slice(0, 60), h.length, h.includes('maxall:')); if (h.includes('maxall:')) break; await p.waitForTimeout(1000); }
            console.log((await p.evaluate(() => document.body.innerText).catch(() => '')).replace(/\s+/g, ' ').slice(0, 300));
            await p.close();
          }
          console.log(seen.slice(0, 15).join('\n'));
          await b.close();
          JS
          xvfb-run -a node p.mjs
