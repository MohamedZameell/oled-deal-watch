name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1 }
      - name: other sites
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          for u in "https://www.mysmartprice.com/computer/pricelist/monitor-price-list-in-india.html" "https://pricehistory.app/" "https://www.91mobiles.com/" "https://www.pricebefore.com/" "https://www.desidime.com/" "https://www.reliancedigital.in/" "https://www.vijaysales.com/" "https://www.croma.com/" "https://www.primeabgb.com/" "https://mdcomputers.in/" ; do
            curl -s -m 20 -A "$UA" -o p.html -w "$u %{http_code} %{size_download}\n" "$u"
          done
      - name: headful chrome smartprix
        run: |
          cat > probe.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch({ headless: false, channel: 'chrome', args: ['--disable-blink-features=AutomationControlled'] });
          const p = await (await b.newContext({ locale: 'en-IN', viewport: { width: 1366, height: 800 } })).newPage();
          for (const u of ['/monitors/oled-type', '/monitors/alienware-aw2726dm-27-inch-wqhd-qd-oled-monitor-ppd1kml1l2fw']) {
            const r = await p.goto('https://www.smartprix.com' + u, { waitUntil: 'domcontentloaded' });
            let ok = false;
            for (let i = 0; i < 20 && !ok; i++) { await p.waitForTimeout(1000); ok = (await p.content()).includes('__WAY_JSON__'); }
            console.log(u, r.status(), 'json after wait:', ok, await p.title());
          }
          await b.close();
          JS
          xvfb-run -a node probe.mjs
